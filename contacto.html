<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Crock</title>
    <link rel="icon" type="image/png" href="assets/logo/Favicon/16px/MC-Favicon-02.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Lexend+Deca:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style/global.css">
    <link rel="stylesheet" href="style/components.css">
    <link rel="stylesheet" href="style/contacto.css">
</head>

<body>
    <header>
        <div class="header_left">
            <img class="logo_header" src="assets/logo/MC-Logo-04.png" alt="">
        </div>
        <div class="header_right">
            <nav class="menu_nav">
                <ul class="menu_nav_items">
                    <li><a href="./index.html">INICIO</a></li>
                    <li><a href="./producto.html">PRODUCTOS</a></li>
                    <li><a href="./clientes.html">CLIENTES</a></li>
                </ul>
                <span class="material-symbols-outlined menu-btn">menu</span>
            </nav>
            <a href="contacto.html" class="main_btn">CONTACTO</a>
        </div>
    </header>
    <main>
        <section class="formularioContacto">
            <div class="formularioBox">

                <form class="formulario" action="#" method="post">

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>

                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Motivo de contacto">

                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje aquí..."
                        required></textarea>

                    <button class="mainBtn" type="submit">
                        ENVIAR MENSAJE
                    </button>

                </form>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer_left">
            <img class="footer_logo" src="assets/logo/Sello/MC-Sello-04.png" alt="">
        </div>
        <div class="footer_center">
            <p>Mr.Crock es una marca registrada de Catering de Suministros S.L.</p>

        </div>
        <div class="footer_right">
            <p>Contacto</p>
            <p>Barrio Zudubiarte 01409, Okondo, Álava, España</p>
        </div>
    </footer>
</body>
</html>
